# Ubuntu squid-openssl. TLS ends at the proxy; the CONNECT tunnel is not intercepted.
https_port 0.0.0.0:443 tls-cert=/etc/squid/agy-tls/fullchain.pem tls-key=/etc/squid/agy-tls/privkey.pem
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/agy-users
auth_param basic realm Antigravity
auth_param basic credentialsttl 1 minute
acl signed_in proxy_auth REQUIRED
acl tls_port port 443
acl private_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl nonpublic_v6 dst ::/96 ::1 fd00::/8 fe80::/10 ff00::/8
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !signed_in
http_access deny to_localhost
http_access deny to_linklocal
http_access deny private_v4
http_access deny nonpublic_v6
http_access allow signed_in
http_access deny all
access_log none
cache deny all
shutdown_lifetime 1 seconds
